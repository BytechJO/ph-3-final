  <body class="ui-repair g3-layout g3-late g3-l15">
    <div class="mask_parent">
      <div class="mask_left"></div>
      <div class="mask_right"></div>
    </div>
    <div class="loading">
      <div class="loader"></div>
    </div>
    <header class="fixed-top"></header>
    <div class="mainContent">
      <div id="feedbackPopup" class="modal fade" role="dialog">
        <div class="modal-dialog modal-dialog-centered">
          <!-- Modal content-->
          <div class="modal-content">
            <div>
              <button
                type="button"
                class="close closeFeedback"
                data-dismiss="modal"
              >
                &times;
              </button>
            </div>
            <div class="modal-body">
              <video id="video_1" src="../videos/goodjob.mp4" preload></video>
              <video id="video_2" src="../videos/tryagain.mp4" preload></video>
            </div>
          </div>
        </div>
      </div>

      <div class="container content_wrap activity_wrap">
        <!-- screen numbering starts here  -->
        <div class="fixed-top screen_numbers_wrap" style="z-index: 2"></div>
        <!-- // screen numbering ends here  -->
        <!-- activity panel content starts here  -->
        <div
          class="activity_buts d-none"
          data-buttons="ccss,link,tips,homework"
        >
          <div class="ccss_content" data-height="">L.1.1</div>
          <div class="link_content" data-height=""></div>
          <div class="tips_content" data-height="">
            <span class="pop_title">Clothes &amp; Accessories</span><br />
            <span
              >Think about what Danny needs depending on the weather and where
              he's going.</span
            >
          </div>
          <div class="homework_content" data-height="">
            Have your child explain why they ticked or didn't tick each item.
          </div>
        </div>
        <!-- // activity panel content ends here  -->
        <!-- activity interactive area starts here  -->
        <div
          class="activity_container activity_area tick_image_items mx-auto"
          data-activity="tickimageitems"
        ></div>
        <!-- // activity interactive area ends here -->
      </div>
      <!-- / container content_wrap -->
    </div>
    <!-- activity panel popup starts here  -->
    <div
      class="modal fade activityCtrlPanel"
      tabindex="-1"
      role="dialog"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <!-- Modal Header -->
          <div class="modal-header">
            <div class="ctrlIcon"></div>
            <h4 class="modal-title"></h4>
            <button type="button" class="close" data-dismiss="modal">
              &times;
            </button>
          </div>
          <!-- Modal body -->
          <div class="modal-body"></div>
        </div>
      </div>
    </div>
    <!-- // activity panel popup ends here  -->
    <div class="sub_footer">
      <!-- the sub-footer starts here  -->
      <div class="container sub_footer_buttons_wrap"></div>
      <!-- // the sub-footer ends here  -->
    </div>
    <footer class="fixed-bottom"></footer>
    <script>

        audio: [],
